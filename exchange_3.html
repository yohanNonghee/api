<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Global Reset & Typography */
        * {
            box-sizing: border-box;
            font-family: "Roboto", sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* Back Button Styling */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background-color: #e2e8f0;
        }

        /* Main Headings and Brand Image */
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .money-img {
            width: 120px;
            margin-bottom: 10px;
        }

        /* Container Layout */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        /* Currency Row Component */
        .currency {
            padding: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
        }

        .currency:last-child {
            border-bottom: none;
        }

        .currency select {
            padding: 10px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f9fa;
            cursor: pointer;
        }

        .currency input {
            border: none;
            background: transparent;
            font-size: 26px;
            font-weight: 600;
            text-align: right;
            width: 130px;
            color: #212529;
        }

        /* Swap Section Controls */
        .swap-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 10px;
            gap: 20px; 
        }

        .btn {
            color: #fff;
            background-color: #ff9800;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 16px;
            transition: background-color 0.2s ease;
            white-space: nowrap; 
        }

        .btn:hover {
            background-color: #f57c00;
        }

        .rate {
            font-size: 15px;
            color: #6c757d;
            font-weight: 500;
            text-align: right;
        }

        /* Focus State Customization */
        select:focus, input:focus, button:focus {
            outline: none;
            border-color: #ff9800;
        }
    </style>
</head>
<body>

    <!-- Back to Home Button -->
    <a href="index.html" class="back-btn">&larr; Back to Home</a>

    <!-- App Header & Graphic -->
    <img src="/asset/money.png" class="money-img" alt="Money Icon">
    <h1>Currency Converter</h1>

    <!-- Converter Card Container -->
    <div class="container">

                <option value="PLN">PLN</option>
                <option value="PYG">PYG</option>
                <option value="RON">RON</option>
                <option value="RUB">RUB</option>
                <option value="SAR">SAR</option>
                <option value="SEK">SEK</option>
                <option value="SGD">SGD</option>
                <option value="THB">THB</option>
                <option value="TRY">TRY</option>
                <option value="TWD">TWD</option>
                <option value="UAH">UAH</option>
                <option value="USD">USD</option>
                <option value="UYU">UYU</option>
                <option value="VND">VND</option>

            </select>
            <!-- Ensure top input is amount-one -->
            <input type="number" id="amount-one" value="1">
        </div>
        
        <!-- Swap Button and Exchange Rate Display -->
        <div class="swap-container">
            <button class="btn" id="btn">Swap currencies</button>
            <div class="rate" id="rate">Exchange rate</div>
        </div>

        <!-- Second Currency Selection Row (Bottom) -->

                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
                <option value="KZT">KZT</option>
                <option value="MXN">MXN</option>
                <option value="MYR">MYR</option>
                <option value="NOK">NOK</option>
                <option value="NZD">NZD</option>
                <option value="PAB">PAB</option>
                <option value="PEN">PEN</option>
                <option value="PHP">PHP</option>
                <option value="PKR">PKR</option>
                <option value="PLN">PLN</option>

            </select>
            <!-- Ensure bottom input is amount-two -->
            <input type="number" id="amount-two" value="1">
        </div>
    </div>

    <!-- Application Script -->
    <script src="exchange.js"></script>
</body>
</html>
